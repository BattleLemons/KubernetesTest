apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-apache
  namespace: lamp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: php-apache
  template:
    metadata:
      labels:
        app: php-apache
    spec:
      containers:
      - name: php-apache
        image: php:8.1-apache
        env:
        - name: DB_HOST
          value: mysql.lamp.svc.cluster.local
        - name: DB_USER
          value: root
        - name: DB_PASSWORD
          value: rootpass
        - name: DB_NAME
          value: wordpress
        ports:
        - containerPort: 80
        volumeMounts:
        - mountPath: /var/www/html
          name: www
      volumes:
      - name: www
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: php-apache
  namespace: lamp
spec:
  type: NodePort
  selector:
    app: php-apache
  ports:
  - port: 80
    nodePort: 30080
